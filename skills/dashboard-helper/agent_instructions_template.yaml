# نموذج: agent_instructions للمهارات
# هذا النموذج يحل الثغرة في نظام مهارات OpenClaw

---
name: اسم-المهارة
description: وصف المهارة
version: "1.0.0"
metadata:
  openclaw:
    emoji: "🔧"
    requires:
      bins: [البرامج_المطلوبة]
    
    # ⭐⭐ قسم جديد: تعليمات الروبوت ⭐⭐
    agent_instructions: |
      # تعليمات مخصصة للروبوت (أسترو وغيره)
      # هذه التعليمات تملأ الفجوة بين "ماذا تفعل المهارة" و"كيف يجعلها الروبوت تعمل"
      
      ## السياق المشترك:
      هذه المهارة تحتاج إعداداً بعد التثبيت. الروبوت يجب أن:
      
      ## الخطوات المطلوبة من الروبوت:
      
      1. **ما بعد التثبيت مباشرة:**
         - [ ] فحص المتطلبات: `which البرنامج_المطلوب`
         - [ ] إنشاء المجلدات اللازمة
         - [ ] نسخ ملفات التكوين النموذجية
      
      2. **إعداد المصادقة/التوكن:**
         - [ ] الحصول على التوكن من: `openclaw dashboard --no-open`
         - [ ] أو من ملف: `~/.openclaw/identity/device-auth.json`
         - [ ] أو توليد توكن جديد: `openssl rand -hex 32`
      
      3. **إعداد ملفات البيئة:**
         - [ ] إنشاء ملف `.env` في مجلد المهارة
         - [ ] تضمين المتغيرات: `OPENCLAW_AUTH_TOKEN`, `PORT`, إلخ
         - [ ] استخدام القيم الافتراضية الآمنة
      
      4. **حل موارد النظام:**
         - [ ] البحث عن بورت متاح (نطاق: 18000-19000)
         - [ ] التحقق من مساحة القرص
         - [ ] التحقق من الذاكرة المتاحة
      
      5. **تشغيل الخدمة:**
         - [ ] تشغيل في الخلفية: `&`
         - [ ] حفظ PID: `$!`
         - [ ] توجيه السجلات لملف
      
      6. **التحقق من التشغيل:**
         - [ ] انتظار 3 ثوان
         - [ ] التحقق بـ `curl` أو `wget`
         - [ ] قراءة السجلات للتحقق
      
      7. **تقديم النتيجة للمستخدم:**
         - [ ] عرض الرابط الكامل
         - [ ] عرض التوكن (مختصر)
         - [ ] عرض PID لإيقاف الخدمة
         - [ ] عرض مكان السجلات
      
      ## معالجة الأخطاء:
      
      إذا فشل أي خطوة:
      1. تسجيل الخطأ في السجلات
      2. محاولة طريقة بديلة
      3. إذا استمر الفشل: إبلاغ المستخدم بالخطوات اليدوية
      
      ## معلومات الصيانة:
      
      - التوكن يتجدد تلقائياً
      - البورت قد يتغير عند إعادة التشغيل
      - السجلات تتراكم ويجب تنظيفها دورياً
      
      ## مثال تنفيذي:
      
      ```bash
      # الحصول على التوكن
      TOKEN=$(openclaw dashboard --no-open 2>&1 | grep -o "token=[a-f0-9]*" | cut -d= -f2)
      
      # إعداد .env
      echo "OPENCLAW_AUTH_TOKEN=$TOKEN" > .env
      echo "PORT=18800" >> .env
      
      # تشغيل الخدمة
      PORT=18800 node server.js > /tmp/service.log 2>&1 &
      SERVICE_PID=$!
      
      # التحقق
      sleep 3
      curl -s "http://127.0.0.1:18800" > /dev/null && echo "✅ الخدمة شغالة"
      ```
      
      ## نصائح للمطورين:
      
      1. دوّن التعليمات في `SKILL.md`
      2. وفر سكريبت إعداد تلقائي
      3. اختبر المهارة مع الروبوت قبل النشر
      4. تحديث التعليمات مع كل إصدار
---

## كيفية استخدام هذا النموذج:

### للمطورين:
1. انسق هذا النموذج في `SKILL.md` الخاص بمهارتك
2. عدل التعليمات ليناسب مهارتك
3. اختبر أن الروبوت يستطيع اتباع التعليمات

### للروبوتات (أسترو):
1. ابحث عن قسم `agent_instructions` في `SKILL.md`
2. اتبع التعليمات خطوة بخطوة
3. سجل النتائج في الذاكرة

### لمستخدمي ClawHub:
المهارات التي تحتوي على `agent_instructions` ستعمل تلقائياً بعد التثبيت!

## فوائد هذا النموذج:

1. **تجربة مستخدم أفضل**: المهارات تعمل فور التثبيت
2. **جودة أعلى**: تقليل بلاغات الأخطاء
3. **تطوير أسرع**: المطورون يركزون على الوظيفة، ليس على التعليمات
4. **روبوتات أكثر ذكاءً**: تعرف بالضبط ماذا تفعل

## مثال من الواقع:

قبل (بدون agent_instructions):
```
المستخدم: "ثبت لي الداشبورد"
الروبوت: يثبت المهارة ← لا يعمل ← المستخدم محبط
```

بعد (مع agent_instructions):
```
المستخدم: "ثبت لي الداشبورد"
الروبوت: يثبت المهارة ← يتبع التعليمات ← يشغل الداشبورد ← يعطي الرابط
المستخدم: 🎉 يعمل!
```

---

**💡 ملاحظة:** هذا النموذج من تطوير **أسترو 🤖✨** بعد اكتشاف الثغرة في نظام مهارات OpenClaw.